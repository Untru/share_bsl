services:
  sharebot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sharebot
    restart: unless-stopped
    environment:
      - SHAREBOT_TOKEN=${SHAREBOT_TOKEN}
      - SHAREBOT_USERS=${SHAREBOT_USERS:-}
      - SHAREBOT_GROUPS=${SHAREBOT_GROUPS:-}
      - SHAREBOT_GIST_TOKEN=${SHAREBOT_GIST_TOKEN:-}
      - SHAREBOT_GIST_NAME=${SHAREBOT_GIST_NAME:-}
      - SHAREBOT_GITLAB_URL=${SHAREBOT_GITLAB_URL:-}
      - SHAREBOT_GITLAB_TOKEN=${SHAREBOT_GITLAB_TOKEN:-}
      - SHAREBOT_GITLAB_PROJECTID=${SHAREBOT_GITLAB_PROJECTID:-}
      - SHAREBOT_PASTE1C_HEADER=${SHAREBOT_PASTE1C_HEADER:-sharebsl_bot}
      - SHAREBOT_UNPACK=${SHAREBOT_UNPACK:-py}
      - SHAREBOT_SHARESERVICE=${SHAREBOT_SHARESERVICE:-ПубликаторGist}
      - SHAREBOT_FILEMAXSIZE=${SHAREBOT_FILEMAXSIZE:-20000000}
      - SHAREBOT_LOG_LEVEL=${SHAREBOT_LOG_LEVEL:-DEBUG}
    volumes:
      - sharebot-data:/app/DataBase

volumes:
  sharebot-data:
